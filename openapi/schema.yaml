openapi: 3.1.0
info:
  title: AdPulse API
  description: AI-powered ad creative analysis API
  version: 0.1.0

servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://api.adpulse.io
    description: Production

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      timestamp:
                        type: string
                        format: date-time
                    required:
                      - status
                      - timestamp
                required:
                  - data

  /api/auth/sign-in/email:
    post:
      operationId: signInEmail
      summary: Sign in with email and password
      description: Handled by Better Auth. Creates DB session and sets httpOnly cookie.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '429':
          description: Rate limit exceeded (5 attempts per 15 minutes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /api/auth/sign-in/social:
    post:
      operationId: signInSocial
      summary: Initiate social OAuth sign-in
      description: |
        Handled by Better Auth. Returns redirect URL to the OAuth provider's authorization page.
        On success, provider redirects back to /api/auth/callback/{provider}.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                    - google
                  description: OAuth provider identifier
                callbackURL:
                  type: string
                  description: URL to redirect after successful OAuth
                errorCallbackURL:
                  type: string
                  description: URL to redirect on OAuth failure
              required:
                - provider
      responses:
        '200':
          description: Returns redirect URL or redirects to OAuth provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: OAuth provider authorization URL
                  redirect:
                    type: boolean

  /api/auth/callback/google:
    get:
      operationId: oauthCallbackGoogle
      summary: Google OAuth callback
      description: |
        Handled internally by Better Auth. Processes OAuth authorization code from Google,
        creates/links user account, establishes session, and redirects to callbackURL.
        Not called directly by clients.
      tags:
        - Auth
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Google
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: CSRF state parameter
      responses:
        '302':
          description: Redirects to callbackURL with session cookie set, or to errorCallbackURL on failure

  /api/auth/request-password-reset:
    post:
      operationId: requestPasswordReset
      summary: Request password reset email
      description: |
        Handled by Better Auth. Generates reset token, stores in Verification table,
        and triggers sendResetPassword callback. Returns 200 regardless of email existence
        to prevent email enumeration.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetRequest'
      responses:
        '200':
          description: Password reset email sent (or silently ignored for unregistered emails)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset email sent successfully.
                required:
                  - message

  /api/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password with token
      description: |
        Handled by Better Auth. Validates reset token from Verification table,
        updates user password, and deletes the token. Token is one-time use.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset successfully.
                required:
                  - message
        '400':
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /api/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out and invalidate session
      description: Handled by Better Auth. Deletes DB session and clears cookie.
      tags:
        - Auth
      responses:
        '200':
          description: Logout successful

  /api/users/me:
    get:
      operationId: getUserProfile
      summary: Get current user profile
      tags:
        - Users
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
                required:
                  - data
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteUserAccount
      summary: Delete current user account (GDPR)
      description: Permanently deletes the authenticated user's account and all associated data.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Account deleted
                    required:
                      - message
                required:
                  - data
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Account deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateUserProfile
      summary: Update current user profile
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
                required:
                  - data
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analyses:
    get:
      operationId: listAnalyses
      summary: List user's analyses with filters and pagination
      description: Returns paginated analyses owned by the authenticated user. Supports filtering by platform, score range, status, and text search.
      tags:
        - Analysis
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            enum: [10, 25, 50]
            default: 10
        - name: platform
          in: query
          schema:
            $ref: '#/components/schemas/Platform'
        - name: scoreMin
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 10
        - name: scoreMax
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 10
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt, score]
            default: createdAt
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Filter analyses created on or after this date (YYYY-MM-DD)
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: Filter analyses created on or before this date (YYYY-MM-DD, inclusive)
        - name: workspace
          in: query
          schema:
            type: boolean
        - name: status
          in: query
          schema:
            type: string
            enum: [COMPLETED, FAILED]
      responses:
        '200':
          description: Paginated list of analyses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalysisSummary'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                    required:
                      - page
                      - pageSize
                      - total
                required:
                  - data
                  - pagination
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createAnalysis
      summary: Upload image or video for analysis
      description: |
        Upload an ad image (PNG, JPG, WebP, max 10MB) or video (MP4, MOV, max 100MB, max 60s)
        for ML analysis. Creates an Analysis record with PENDING status.
        Use `?type=video` query parameter for video uploads.
      tags:
        - Analysis
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [image, video]
            default: image
          description: Upload type — determines file size limits and accepted formats
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Image (PNG, JPG, WebP, max 10MB) or video (MP4, MOV, max 100MB)
                platform:
                  type: string
                  enum:
                    - meta
                    - tiktok
                    - linkedin
                    - general
              required:
                - image
                - platform
      responses:
        '201':
          description: Analysis created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AnalysisCreated'
                required:
                  - data
        '400':
          description: |
            Validation error. Possible codes:
            - UNSUPPORTED_FORMAT — invalid file type
            - FILE_TOO_LARGE — exceeds size limit (10MB image, 100MB video)
            - VIDEO_TOO_LONG — video exceeds 60 seconds
            - FILE_REQUIRED — no file attached
            - VALIDATION_ERROR — invalid platform or type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analyses/{analysisId}:
    get:
      operationId: getAnalysisDetail
      summary: Get full analysis detail
      description: Returns full analysis result including signed S3 URLs for heatmaps. Returns 404 for deleted analyses.
      tags:
        - Analysis
      parameters:
        - name: analysisId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full analysis detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AnalysisDetail'
                required:
                  - data
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Analysis not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteAnalysis
      summary: Soft-delete an analysis
      description: Sets analysis status to DELETED. Cannot delete PENDING or PROCESSING analyses.
      tags:
        - Analysis
      parameters:
        - name: analysisId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Analysis deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Analysis deleted
                    required:
                      - message
                required:
                  - data
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Analysis not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Analysis is currently being processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analyses/{analysisId}/retry:
    post:
      operationId: retryAnalysis
      summary: Retry a failed analysis
      description: Re-queues a failed analysis for processing. Costs 1 credit.
      tags:
        - Analysis
      parameters:
        - name: analysisId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Analysis retry queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AnalysisCreated'
                required:
                  - data
        '400':
          description: Analysis is not in FAILED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Analysis not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analyses/{analysisId}/report:
    get:
      operationId: getAnalysisReport
      summary: Download PDF report for a completed analysis
      description: Generates and returns a PDF report containing heatmap, scores, elements, insights, and classification.
      tags:
        - Analysis
      parameters:
        - name: analysisId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF report file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Analysis not in COMPLETED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Analysis not found or not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analyses/{analysisId}/stream:
    get:
      operationId: streamAnalysisProgress
      summary: SSE stream for analysis progress
      description: |
        Server-Sent Events stream that delivers real-time progress updates during analysis.
        Events: progress (stages 0-3), complete, error.
        Connection closes automatically on completion or error.
      tags:
        - Analysis
      parameters:
        - name: analysisId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE events (progress, complete, error)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Analysis not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code in SCREAMING_SNAKE_CASE
              example: INTERNAL_ERROR
            message:
              type: string
              description: Human-readable error message
              example: An unexpected error occurred
            details:
              type: object
              additionalProperties: true
          required:
            - code
            - message
      required:
        - error

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        image:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - emailVerified
        - createdAt
        - updatedAt

    Session:
      type: object
      properties:
        id:
          type: string
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
        userId:
          type: string
      required:
        - id
        - expiresAt
        - token
        - userId

    SignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        rememberMe:
          type: boolean
          default: true
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'
      required:
        - user
        - session

    AuthErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - SESSION_EXPIRED
                - EMAIL_EXISTS
                - INVALID_CREDENTIALS
                - VALIDATION_ERROR
                - RATE_LIMIT_EXCEEDED
                - OAUTH_FAILED
                - INVALID_RESET_TOKEN
                - EMAIL_SEND_FAILED
                - FORBIDDEN
                - ACCOUNT_DELETION_FAILED
                - UNSUPPORTED_FORMAT
                - FILE_TOO_LARGE
                - FILE_REQUIRED
                - QUOTA_EXCEEDED
                - JOB_QUEUE_FAILED
                - SQS_SEND_FAILED
                - MODAL_PIPELINE_UNAVAILABLE
                - MODAL_PIPELINE_FAILED
                - MODAL_PIPELINE_TIMEOUT
                - MODAL_PIPELINE_INVALID_RESPONSE
                - MODAL_SUM_UNAVAILABLE
                - MODAL_SUM_FAILED
                - MODAL_SUM_TIMEOUT
                - MODAL_SUM_INVALID_RESPONSE
                - MODAL_BOTH_FAILED
                - S3_UPLOAD_FAILED
                - S3_DOWNLOAD_FAILED
                - S3_INVALID_URL
                - ANALYSIS_PIPELINE_FAILED
                - SCORING_FAILED
                - LLM_UNAVAILABLE
                - CLASSIFICATION_UNAVAILABLE
                - ML_TIMEOUT
                - PROCESSING_FAILED
                - ANALYSIS_NOT_FOUND
                - ANALYSIS_NOT_FAILED
                - ANALYSIS_NOT_COMPLETE
                - ANALYSIS_IN_PROGRESS
                - VIDEO_TOO_LONG
                - VIDEO_PROBE_FAILED
            message:
              type: string
          required:
            - code
            - message
      required:
        - error

    RequestPasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        redirectTo:
          type: string
          description: URL to redirect user after clicking reset link
      required:
        - email

    ResetPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 8
        token:
          type: string
          description: Reset token from email link
      required:
        - newPassword
        - token

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        image:
          type: string
          nullable: true
        role:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - createdAt

    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          description: Current password for confirmation
      required:
        - password

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - name

    AnalysisSummary:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        platform:
          $ref: '#/components/schemas/Platform'
        overallScore:
          type: number
          minimum: 1.0
          maximum: 10.0
          nullable: true
          description: Overall score from results.scoring.overallScore (null if not completed)
        verdict:
          type: string
          nullable: true
          enum: [Strong, Good, Needs Work]
          description: Verdict from results.scoring.verdict (null if not completed)
        imageUrl:
          type: string
          description: Signed S3 URL for the analysis image
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - platform
        - imageUrl
        - createdAt

    AnalysisCreated:
      type: object
      properties:
        analysisId:
          type: string
        status:
          $ref: '#/components/schemas/AnalysisStatus'
      required:
        - analysisId
        - status

    AnalysisDetail:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        platform:
          $ref: '#/components/schemas/Platform'
        mediaType:
          $ref: '#/components/schemas/MediaType'
        imageUrl:
          type: string
          description: Signed S3 URL for the analysis image
        results:
          type: object
          nullable: true
          description: Full analysis results (scoring, insights, classification, heatmaps). Null if not completed.
          properties:
            scoring:
              $ref: '#/components/schemas/ScoringResult'
            insights:
              $ref: '#/components/schemas/Insights'
            classification:
              $ref: '#/components/schemas/ClassificationResult'
            heatmaps:
              type: object
              properties:
                heatmap:
                  type: string
                  description: Signed S3 URL for heatmap overlay
                overlay:
                  type: string
                  description: Signed S3 URL for overlay image
              required:
                - heatmap
                - overlay
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - platform
        - imageUrl
        - createdAt
        - updatedAt

    AnalysisStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
        - DELETED

    Platform:
      type: string
      enum:
        - meta
        - tiktok
        - linkedin
        - general

    MediaType:
      type: string
      enum:
        - IMAGE
        - VIDEO

    ScoringResult:
      type: object
      properties:
        overallScore:
          type: number
          minimum: 1.0
          maximum: 10.0
          description: Weighted overall score (1-10, one decimal)
        verdict:
          $ref: '#/components/schemas/Verdict'
        subScores:
          $ref: '#/components/schemas/SubScores'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/ElementScore'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ScoringIssue'
        platformModifiers:
          $ref: '#/components/schemas/PlatformWeights'
      required:
        - overallScore
        - verdict
        - subScores
        - elements
        - issues
        - platformModifiers

    Verdict:
      type: string
      enum:
        - Strong
        - Good
        - Needs Work

    SubScores:
      type: object
      properties:
        attention:
          type: number
          minimum: 1.0
          maximum: 10.0
        branding:
          type: number
          minimum: 1.0
          maximum: 10.0
        message:
          type: number
          minimum: 1.0
          maximum: 10.0
        aesthetic:
          type: number
          minimum: 1.0
          maximum: 10.0
      required:
        - attention
        - branding
        - message
        - aesthetic

    ElementScore:
      type: object
      properties:
        type:
          type: string
          description: Element type (branding, product, headline, cta, body_text)
        found:
          type: boolean
        attentionPercent:
          type: number
          description: Percentage of visual attention on this element
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          description: Bounding box [x1, y1, x2, y2] in pixels
        confidence:
          type: number
          description: Detection confidence (0-1)
      required:
        - type
        - found
        - attentionPercent

    ScoringIssue:
      type: object
      properties:
        severity:
          type: string
          enum:
            - critical
            - warning
        element:
          type: string
        message:
          type: string
        attentionPercent:
          type: number
      required:
        - severity
        - element
        - message

    PlatformWeights:
      type: object
      properties:
        attention:
          type: number
        branding:
          type: number
        message:
          type: number
        aesthetic:
          type: number
      required:
        - attention
        - branding
        - message
        - aesthetic

    InsightsResult:
      type: object
      properties:
        unavailable:
          type: boolean
          enum: [false]
        working:
          type: array
          items:
            type: string
          description: What the ad does well
        issues:
          type: array
          items:
            type: string
          description: Problems or weaknesses identified
        recommendations:
          type: array
          items:
            type: string
          description: Actionable improvement suggestions
        platformNotes:
          type: string
          description: Platform-specific observations
      required:
        - unavailable
        - working
        - issues
        - recommendations
        - platformNotes

    InsightsUnavailable:
      type: object
      properties:
        unavailable:
          type: boolean
          enum: [true]
        message:
          type: string
      required:
        - unavailable
        - message

    Insights:
      oneOf:
        - $ref: '#/components/schemas/InsightsResult'
        - $ref: '#/components/schemas/InsightsUnavailable'
      discriminator:
        propertyName: unavailable

    SentimentResult:
      type: object
      properties:
        primary:
          type: string
          description: Dominant emotion detected
        secondary:
          type: string
          description: Second most dominant emotion
        scores:
          type: object
          additionalProperties:
            type: number
          description: All 30 emotion scores (0-1)
      required:
        - primary
        - secondary
        - scores

    CategoryLevel:
      type: object
      properties:
        level:
          type: integer
          description: Hierarchy level (1 = broad, 2 = sub-category)
        label:
          type: string
          description: Category label
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Classification confidence
      required:
        - level
        - label
        - confidence

    CategoryResult:
      type: object
      properties:
        levels:
          type: array
          items:
            $ref: '#/components/schemas/CategoryLevel'
          description: Hierarchical category levels (truncated at first low-confidence level)
      required:
        - levels

    ClassificationResult:
      type: object
      properties:
        sentiment:
          oneOf:
            - $ref: '#/components/schemas/SentimentResult'
            - type: 'null'
          description: Sentiment classification (null if unavailable)
        category:
          oneOf:
            - $ref: '#/components/schemas/CategoryResult'
            - type: 'null'
          description: Category classification (null if unavailable)
      required:
        - sentiment
        - category

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
          required:
            - page
            - pageSize
            - total
      required:
        - data
        - pagination

    SSEProgressEvent:
      type: object
      properties:
        stage:
          type: integer
          enum: [0, 1, 2, 3]
        label:
          type: string
        progress:
          type: number
          minimum: 0
          maximum: 1
      required:
        - stage
        - label
        - progress

    SSECompleteEvent:
      type: object
      properties:
        analysisId:
          type: string
      required:
        - analysisId

    SSEErrorEvent:
      type: object
      properties:
        code:
          type: string
          enum:
            - ML_TIMEOUT
            - PROCESSING_FAILED
        message:
          type: string
      required:
        - code
        - message

    UsageResponse:
      type: object
      properties:
        used:
          type: integer
          description: Credits used in current billing period
        limit:
          type: integer
          description: Credit limit for current tier
        estimatedCredits:
          type: integer
          description: Estimated credits for the requested operation
      required:
        - used
        - limit
        - estimatedCredits
